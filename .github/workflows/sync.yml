# 定时从源仓库 anhao/ai-pose-gallery-zh 同步更新
# 有新提交时：merge 上游 → 自动构建 → 部署到 Cloudflare Workers
# 无新提交时：跳过构建与部署
# 注：GitHub schedule 在整点高峰经常延迟甚至跳过，故选错峰分钟点
name: Sync upstream and deploy

on:
  schedule:
    - cron: '43 0 * * *' # UTC 0:43 = 北京时间每天 08:43
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream updates
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/anhao/ai-pose-gallery-zh.git
          git fetch upstream main
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "本仓库落后上游 $BEHIND 个提交"
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" -gt 0 ]; then
            # merge 保留本仓库的 Basic Auth / CI 修改；若上游改动冲突则失败并通知
            git merge upstream/main --no-edit -m "chore: sync upstream (behind $BEHIND commits)"
            git push origin main
          fi

      - uses: actions/setup-node@v4
        if: steps.sync.outputs.behind != '0'
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.sync.outputs.behind != '0'
        run: |
          npm i -g pnpm@10
          pnpm install --frozen-lockfile

      - name: Build dist
        if: steps.sync.outputs.behind != '0'
        run: bash scripts/build.sh

      - name: Deploy to Cloudflare Workers
        if: steps.sync.outputs.behind != '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --var AUTH_PASSWORD:${{ secrets.AUTH_PASSWORD }}
